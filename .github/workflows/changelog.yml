name: Changelog

# Keeps CHANGELOG.md in sync with the commit log on every push, for anyone who
# has not installed the local .githooks (see scripts/install-hooks.sh).

on:
  push:
    branches: ["main"]   # main only — feature branches must not get auto-commits
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true   # second push cancels the first — no duplicate commits

jobs:
  changelog:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip-changelog')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history: the generator reads git log
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate changelog block
        run: python3 scripts/update_changelog.py

      - name: Commit changelog, if it changed
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already up to date"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: auto-update changelog [skip-changelog]"
          git push
